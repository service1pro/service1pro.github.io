
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>이정화 | 리테일 강의</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background:linear-gradient(145deg,#eef5ff,#fff);
  color:#17365d;
}
.card{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  padding:42px 25px 30px;
  text-align:center;
}
.top{padding-top:20px}
.badge{
  display:inline-block;
  padding:8px 16px;
  border-radius:30px;
  background:#dceaff;
  font-size:15px;
  font-weight:700;
  margin-bottom:18px;
}
.name{
  font-size:44px;
  font-weight:900;
  letter-spacing:-2px;
  margin:0 0 12px;
}
.intro{
  font-size:20px;
  line-height:1.6;
  font-weight:500;
  margin:0;
}
.highlight{font-weight:800}
.work{margin:35px 0}
.work-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:18px;
}
.items{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.item{
  background:#fff;
  border:2px solid #d7e5f7;
  border-radius:20px;
  padding:20px 8px;
  font-size:19px;
  font-weight:800;
  box-shadow:0 8px 18px rgba(23,54,93,.08);
}
.number{
  display:block;
  font-size:14px;
  margin-bottom:8px;
  opacity:.55;
}
.contact{
  display:block;
  width:100%;
  padding:19px;
  margin-top:35px;
  border-radius:22px;
  background:#17365d;
  color:#fff;
  text-decoration:none;
  font-size:22px;
  font-weight:800;
  box-shadow:0 10px 22px rgba(23,54,93,.2);
}
.calculator{
  margin-top:38px;
  padding:25px 20px;
  background:#fff;
  border-radius:24px;
  box-shadow:0 8px 20px rgba(23,54,93,.08);
}
.calculator h2{
  margin:0 0 5px;
  font-size:22px;
}
.calculator p{
  margin:0 0 20px;
  font-size:14px;
  opacity:.65;
}
.input{
  width:100%;
  padding:15px;
  margin-bottom:10px;
  border:2px solid #d7e5f7;
  border-radius:14px;
  font-size:18px;
  text-align:right;
  outline:none;
}
.input:focus{border-color:#17365d}
.calc-btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#dceaff;
  color:#17365d;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}
.result{
  margin-top:18px;
  padding:17px;
  border-radius:16px;
  background:#f1f6fc;
  font-size:16px;
}
.result strong{
  display:block;
  margin-top:5px;
  font-size:28px;
}
@media(max-width:360px){
  .name{font-size:38px}
  .intro{font-size:18px}
  .item{font-size:17px}
}
</style>
</head>

<body>
<main class="card">

  <section class="top">
    <div class="badge">RETAIL · SERVICE · PEOPLE</div>
    <h1 class="name">이정화</h1>
    <p class="intro">
      리테일 현장에서 배우고 경험한<br>
      <span class="highlight">서비스의 가치를 전합니다.</span>
    </p>
  </section>

  <section class="work">
    <div class="work-title">제가 하는 일 ✦</div>
    <div class="items">
      <div class="item"><span class="number">01</span>교육</div>
      <div class="item"><span class="number">02</span>강의</div>
      <div class="item"><span class="number">03</span>코칭</div>
    </div>
  </section>

  <a class="contact" href="tel:01000000000">
    상담하기 <span>→</span>
  </a>

  <section class="calculator">
    <h2>💰 모임 회비 나누기</h2>
    <p>총 금액과 인원을 입력해 주세요.</p>

    <input
      id="total"
      class="input"
      type="number"
      inputmode="numeric"
      placeholder="총 금액 (원)"
    >

    <input
      id="people"
      class="input"
      type="number"
      inputmode="numeric"
      placeholder="인원 (명)"
    >

    <button class="calc-btn" onclick="calculate()">1인 금액 계산하기</button>

    <div class="result">
      1인당 금액
      <strong id="result">0원</strong>
    </div>
  </section>

</main>

<script>
function calculate(){
  const total = Number(document.getElementById("total").value);
  const people = Number(document.getElementById("people").value);
  const result = document.getElementById("result");

  if(total <= 0 || people <= 0){
    result.textContent = "금액과 인원을 입력해 주세요";
    return;
  }

  const amount = Math.ceil(total / people);
  result.textContent = amount.toLocaleString("ko-KR") + "원";
}
</script>

</body>
</html>
